name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'  # Dart 3.5.x; >=3.19.2 required by google_fonts ^6.2.1
          
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sangaso-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
