name: sangaso
description: Sangaso – on-demand home-services marketplace (Flutter + Firebase).
publish_to: 'none'
version: 1.0.3+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Dependencies
  firebase_core: ^2.30.0
  firebase_auth: ^4.18.1
  google_sign_in: ^6.2.1
  firebase_messaging: ^14.9.4
  cloud_firestore: ^4.16.2
  firebase_storage: ^11.4.2

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^12.0.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.2.2
  image_picker: ^1.0.4
  google_fonts: ^6.2.1

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  firebase_auth_mocks: ^0.13.0
  mock_exceptions: ^0.8.2
  fake_cloud_firestore: ^2.5.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#BEBEBE"
    theme_color: "#CF4F23"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Add this if you have custom fonts
  # fonts:
  #   - family: YourFont
  #     fonts:
  #       - asset: assets/fonts/yourfont.ttf
