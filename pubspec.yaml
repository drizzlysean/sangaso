name: sangaso
description: Sangaso – on-demand home-services marketplace (Flutter + Firebase).
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Dependencies
  firebase_core: ^2.30.0
  firebase_auth: ^4.18.1
  cloud_firestore: ^4.16.2
  firebase_storage: ^11.4.2

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^12.0.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.2.2
  image_picker: ^1.0.4
  google_fonts: ^6.2.1

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Add this if you have custom fonts
  # fonts:
  #   - family: YourFont
  #     fonts:
  #       - asset: assets/fonts/yourfont.ttf
